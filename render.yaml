services:
  - type: web
    name: idea-apps-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_ANTHROPIC_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
